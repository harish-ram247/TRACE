name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: trace
          POSTGRES_PASSWORD: trace
          POSTGRES_DB: trace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trace -d trace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://trace:trace@localhost:5432/trace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Check dependencies for known vulnerabilities
        run: pip-audit --progress-spinner off --skip-editable
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: pytest -v

  # Builds the production image and starts the stack the way the server runs it.
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Production .env for the smoke test
        run: |
          cp .env.example .env
          echo "POSTGRES_PASSWORD=ci-only-password" >> .env
          echo "TRACE_DOMAIN=localhost" >> .env
      - name: Build the image
        run: docker compose -f docker-compose.prod.yml build
      - name: Start database, API (runs migrations) and UI
        run: docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 180 db api ui
      - name: API health, database and extensions
        run: |
          docker compose -f docker-compose.prod.yml exec -T api python -c "
          import json, urllib.request
          for path in ('/health', '/health/db'):
              body = urllib.request.urlopen('http://localhost:8000' + path).read()
              print(path, json.loads(body))
          "
      - name: Migrations at head
        run: docker compose -f docker-compose.prod.yml exec -T api alembic current
      - name: UI responds
        run: |
          docker compose -f docker-compose.prod.yml exec -T ui python -c "
          import urllib.request
          print(urllib.request.urlopen('http://localhost:8501/_stcore/health').read().decode())
          "
      - name: Logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --tail 100

