# Streamlit settings for the demo UI (read from the working directory: run streamlit from the repo root).
# Visual direction: "Timetable" (see .impeccable/surfaces/ui-app-py.md). Light: visitors are
# recruiters opening a link on a laptop in daylight.

[theme]
base = "light"
primaryColor = "#003082"            # timetable blue: actions, focus, selection
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F3F1"
textColor = "#111111"
borderColor = "#CFCFCB"
blueColor = "#003082"
redColor = "#C8102E"
font = "Archivo, Arial, sans-serif"
headingFont = "Archivo, Arial, sans-serif"
codeFont = "JetBrains Mono, ui-monospace, monospace"
baseRadius = "0px"
buttonRadius = "0px"
showWidgetBorder = true

[client]
toolbarMode = "viewer"              # hides the developer "Deploy" button and menu entries

[browser]
gatherUsageStats = false
